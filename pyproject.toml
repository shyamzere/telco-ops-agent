[project]
name = "telco-ops-agent"
version = "0.1.0"
description = "Read-only AI ops assistant that answers questions about fake telco data in Snowflake via an MCP server and a Strands agent on Bedrock."
readme = "README.md"
authors = [
    { name = "Shyam Zere" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.0",
    "mcp[cli]<2",
    "snowflake-connector-python>=5.2.0",
    "strands-agents>=1.64.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
ui = [
    "streamlit>=1.67.0",
]
